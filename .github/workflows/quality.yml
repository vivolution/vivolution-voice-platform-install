name: Public bootstrap quality

on:
  push:
    branches: [main, 'bootstrap/**', 'hardening/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Main-channel validation
        run: |
          tests/test-bootstrap.sh
          tests/test-main-channel.sh
      - name: ShellCheck
        run: shellcheck install.sh tests/test-bootstrap.sh tests/test-main-channel.sh
