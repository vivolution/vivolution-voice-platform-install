name: v0.1.0-rc2 public candidate quality

on:
  push:
    branches:
      - release/v0.1.0-rc2
  pull_request:
    branches:
      - release/v0.1.0-rc2

permissions:
  contents: read

concurrency:
  group: rc2-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate bootstrap syntax and release constants
        run: sh tests/test-release-bootstrap.sh
      - name: ShellCheck
        run: shellcheck --severity=warning install.sh tests/test-release-bootstrap.sh
      - name: Validate release metadata consistency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re

          root = pathlib.Path('release-input')
          manifest_path = root / 'vivolution-voice-platform-0.1.0-rc2-controller-amd64.manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          summary = json.loads((root / 'build-summary.json').read_text(encoding='utf-8'))
          checksums = {}
          for line in (root / 'SHA256SUMS').read_text(encoding='utf-8').splitlines():
              digest, name = line.split(None, 1)
              checksums[name.strip()] = digest

          assert manifest['schema_version'] == 1
          assert manifest['product'] == 'Vivolution Voice Platform'
          assert manifest['release'] == '0.1.0-rc2'
          assert manifest['source_commit'] == '13f04ab66bba2dc5f8442d410be0c96919b56710'
          assert re.fullmatch(r'[0-9a-f]{40}', manifest['source_commit'])
          artifact = manifest['artifact']
          assert artifact['os'] == 'debian-13'
          assert artifact['architecture'] == 'amd64'
          assert artifact['entrypoint'] == 'installer/install.sh'
          assert artifact['archive_root'] == 'vivolution-voice-platform-0.1.0-rc2'
          assert artifact['sha256'] == '5bd38574fb1f5244a571a91fdeb82c326d50795fe8c0475c1065277687db7b25'
          assert artifact['bytes'] == 167052
          assert manifest['sbom']['sha256'] == '6d7f19bd525eb3fa05fee82f79c7bf9bad37330bd6a8211cd63ccd167994a405'
          assert summary['artifact_sha256'] == artifact['sha256']
          assert summary['artifact_bytes'] == artifact['bytes']
          assert summary['sbom_sha256'] == manifest['sbom']['sha256']
          actual_manifest = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          assert checksums[manifest_path.name] == actual_manifest
          assert checksums[artifact['name']] == artifact['sha256']
          assert checksums[manifest['sbom']['name']] == manifest['sbom']['sha256']
          PY
      - name: Reject credentials and private keys
        run: |
          set -euo pipefail
          if git grep -n -I -E -- 'BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY|AKIA[0-9A-Z]{16}|(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]+' -- ':!*.md'; then
            echo 'Potential credential or private key detected.' >&2
            exit 1
          fi
