name: Publish v0.1.0-rc3 Controller candidate

on:
  push:
    branches:
      - release/v0.1.0-rc3
    paths:
      - PUBLISH_APPROVED
      - install.sh
      - RELEASE_NOTES.md
      - release-input/**
      - tests/test-release-bootstrap.sh
      - .github/workflows/publish-rc3.yml

permissions:
  contents: write

concurrency:
  group: publish-v0.1.0-rc3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-cda8-81f4-92ee-d0b450c6ee82/raw?se=2026-09-03T15%3A38%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=01a067cf-441b-7059-b29d-d9afd09862ae&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T04%3A40%3A47Z&ske=2026-09-04T04%3A40%3A47Z&sks=b&skv=2026-02-06&sig=cfbn5xyoyNP7Ndk0GXVRS9NUSz74HSh1ll7qIpLiWGg%3D'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Confirm publication authorization and bootstrap identity
        run: |
          set -euo pipefail
          test "$(cat PUBLISH_APPROVED)" = 'v0.1.0-rc3 ecff3fe017ed30611ffbc7e45a3f24c5aa1de6b9'
          sh tests/test-release-bootstrap.sh
      - name: Download exact private-build artifact bundle
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 300 --retry 3 --retry-all-errors \
            --output /tmp/controller-build.zip "$SOURCE_ARTIFACT_URL"
          test "$(stat -c %s /tmp/controller-build.zip)" = '260822'
          printf '%s  %s\n' \
            '98770a69b5b74bf2fcd8a7dd0056dd6e0c21edd3985430617bcd1185bcdd4c70' \
            /tmp/controller-build.zip | sha256sum --check --strict
          mkdir /tmp/controller-build
          unzip -q /tmp/controller-build.zip -d /tmp/controller-build
      - name: Verify transferred files and release metadata
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            SHA256SUMS \
            build-summary.json \
            vivolution-voice-platform-0.1.0-rc3-controller-amd64.manifest.json \
            vivolution-voice-platform-0.1.0-rc3-controller-amd64.spdx.json \
            vivolution-voice-platform-0.1.0-rc3-controller-amd64.tar.gz)
          actual=$(find /tmp/controller-build -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          test "$actual" = "$expected"
          test -z "$(find /tmp/controller-build -mindepth 1 ! -type f -print -quit)"
          cmp release-input/SHA256SUMS /tmp/controller-build/SHA256SUMS
          cmp release-input/build-summary.json /tmp/controller-build/build-summary.json
          cmp release-input/vivolution-voice-platform-0.1.0-rc3-controller-amd64.manifest.json \
              /tmp/controller-build/vivolution-voice-platform-0.1.0-rc3-controller-amd64.manifest.json
          cd /tmp/controller-build
          sha256sum --check --strict SHA256SUMS
          test "$(stat -c %s vivolution-voice-platform-0.1.0-rc3-controller-amd64.tar.gz)" = '169279'
          python3 -m json.tool vivolution-voice-platform-0.1.0-rc3-controller-amd64.manifest.json >/dev/null
          python3 -m json.tool vivolution-voice-platform-0.1.0-rc3-controller-amd64.spdx.json >/dev/null
      - name: Verify archive layout and packaged identity again
        run: |
          set -euo pipefail
          artifact=/tmp/controller-build/vivolution-voice-platform-0.1.0-rc3-controller-amd64.tar.gz
          listing=$(mktemp)
          metadata=$(mktemp)
          root=$(mktemp -d)
          trap 'rm -f "$listing" "$metadata"; rm -rf "$root"' EXIT
          tar -tzf "$artifact" > "$listing"
          awk '
            index($0,"vivolution-voice-platform-0.1.0-rc3/") != 1 { exit 1 }
            /(^|\/)\.\.($|\/)/ { exit 1 }
            /(^|\/)\.($|\/)/ { exit 1 }
            seen[$0]++ { exit 1 }
            END { if (NR == 0 || NR > 4096) exit 1 }
          ' "$listing"
          LC_ALL=C tar -tvzf "$artifact" > "$metadata"
          awk 'substr($0,1,1)!="-" && substr($0,1,1)!="d" { exit 1 } END { if (NR==0) exit 1 }' "$metadata"
          tar -xzf "$artifact" -C "$root" --no-same-owner --no-same-permissions
          release_root="$root/vivolution-voice-platform-0.1.0-rc3"
          test -x "$release_root/installer/install.sh"
          test -x "$release_root/installer/turnkey.py"
          test -z "$(find "$release_root" -type l -print -quit)"
          python3 - "$release_root/RELEASE-MANIFEST.json" <<'PY'
          import json, pathlib, sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          expected = {
              'architecture': 'amd64',
              'entrypoint': 'installer/install.sh',
              'os': 'debian-13',
              'product': 'Vivolution Voice Platform',
              'release': '0.1.0-rc3',
              'role': 'controller',
              'schema_version': 1,
              'source_commit': 'ecff3fe017ed30611ffbc7e45a3f24c5aa1de6b9',
          }
          for key, expected_value in expected.items():
              assert value.get(key) == expected_value, key
          assert value.get('company') == 'Vivolution Technologies LLC'
          files = value.get('files')
          assert isinstance(files, list) and files
          paths = {item['path'] for item in files}
          for required in ('VERSION', 'controller/manage.py', 'installer/install.sh', 'installer/turnkey.py'):
              assert required in paths, required
          PY
      - name: Refuse an existing release tag
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.0-rc3 >/dev/null 2>&1; then
            echo 'Tag v0.1.0-rc3 already exists and will not be rewritten.' >&2
            exit 1
          fi
      - name: Publish prerelease and exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.1.0-rc3 \
            /tmp/controller-build/vivolution-voice-platform-0.1.0-rc3-controller-amd64.tar.gz \
            /tmp/controller-build/vivolution-voice-platform-0.1.0-rc3-controller-amd64.manifest.json \
            /tmp/controller-build/vivolution-voice-platform-0.1.0-rc3-controller-amd64.spdx.json \
            /tmp/controller-build/SHA256SUMS \
            /tmp/controller-build/build-summary.json \
            --target "$GITHUB_SHA" \
            --title 'v0.1.0-rc3 — standalone Controller Plane test candidate' \
            --notes-file RELEASE_NOTES.md \
            --prerelease
      - name: Verify anonymous release and version-pinned bootstrap
        run: |
          set -euo pipefail
          base=https://github.com/vivolution/vivolution-voice-platform-install/releases/download/v0.1.0-rc3
          mkdir /tmp/anonymous
          for name in \
            vivolution-voice-platform-0.1.0-rc3-controller-amd64.tar.gz \
            vivolution-voice-platform-0.1.0-rc3-controller-amd64.manifest.json \
            vivolution-voice-platform-0.1.0-rc3-controller-amd64.spdx.json \
            SHA256SUMS \
            build-summary.json
          do
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --location \
                --proto '=https' --proto-redir '=https' --tlsv1.2 \
                --output "/tmp/anonymous/$name" "$base/$name"; then
                break
              fi
              test "$attempt" -lt 30
              sleep 2
            done
          done
          cd /tmp/anonymous
          sha256sum --check --strict SHA256SUMS
          cmp vivolution-voice-platform-0.1.0-rc3-controller-amd64.manifest.json \
              "$GITHUB_WORKSPACE/release-input/vivolution-voice-platform-0.1.0-rc3-controller-amd64.manifest.json"
          curl --fail --show-error --silent --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output /tmp/anonymous/install.sh \
            https://raw.githubusercontent.com/vivolution/vivolution-voice-platform-install/v0.1.0-rc3/install.sh
          docker run --rm \
            --volume /tmp/anonymous/install.sh:/install.sh:ro \
            debian:13-slim \
            sh -c 'apt-get update >/dev/null && apt-get install -y --no-install-recommends ca-certificates curl findutils gawk python3 tar >/dev/null && sh /install.sh --verify-only'
