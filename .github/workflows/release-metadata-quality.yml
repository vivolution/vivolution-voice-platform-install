name: Release metadata quality

on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate inactive channel metadata
        run: |
          tests/test-bootstrap.sh
          tests/test-main-channel.sh
          python3 -m json.tool channels/stable.json >/dev/null
          python3 -m json.tool channels/preview.json >/dev/null
          python3 -m json.tool schemas/release-manifest.schema.json >/dev/null
      - name: Static shell analysis
        run: shellcheck install.sh tests/test-bootstrap.sh tests/test-main-channel.sh
