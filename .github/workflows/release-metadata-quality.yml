name: Release metadata quality

on:
  push:
    branches: [main, 'hardening/**', 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-metadata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate bootstrap behavior and metadata contracts
        run: |
          if [ -f tests/test-release-bootstrap.sh ]; then
            sh tests/test-release-bootstrap.sh
          else
            sh tests/test-bootstrap.sh
            sh tests/test-main-channel.sh
          fi
          python3 -m json.tool channels/stable.json >/dev/null
          python3 -m json.tool channels/preview.json >/dev/null
          python3 -m json.tool schemas/release-manifest.schema.json >/dev/null
      - name: Static shell analysis
        run: shellcheck install.sh tests/test-*.sh
      - name: Reject credentials and private key material
        run: |
          set -eu
          if git grep -n -I -E -- 'BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY|AKIA[0-9A-Z]{16}|(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]+'; then
            echo 'Potential credential or private key detected.' >&2
            exit 1
          fi
