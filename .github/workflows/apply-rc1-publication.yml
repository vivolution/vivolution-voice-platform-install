name: Apply v0.1.0-rc1 public release staging

on:
  push:
    branches:
      - release/v0.1.0-rc1
    paths:
      - .automation/public-text-payload.tar.gz
      - .github/workflows/apply-rc1-publication.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v0.1.0-rc1-publication
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/v0.1.0-rc1
          fetch-depth: 0
      - name: Validate and extract bounded staging payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          payload = Path('.automation/public-text-payload.tar.gz')
          allowed = {
              'install.sh',
              'README.md',
              'VERSION',
              'channels/preview.json',
              'channels/stable.json',
              'schemas/release-manifest.schema.json',
              'tests/test-bootstrap.sh',
              'tests/test-main-channel.sh',
              'publication/v0.1.0-rc1/vivolution-voice-platform-0.1.0-rc1-controller-amd64.manifest.json',
              'publication/v0.1.0-rc1/SHA256SUMS',
              'publication/v0.1.0-rc1/build-summary.json',
              'publication/v0.1.0-rc1/RELEASE-NOTES.md',
          }
          with tarfile.open(payload, 'r:gz') as bundle:
              members = bundle.getmembers()
              names = {member.name for member in members}
              if names != allowed:
                  raise SystemExit(f'unexpected staging payload paths: {sorted(names ^ allowed)}')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or any(part in {'', '.', '..'} for part in path.parts):
                      raise SystemExit(f'unsafe path: {member.name}')
                  if not member.isfile() or member.size > 65536:
                      raise SystemExit(f'unsafe staging object: {member.name}')
              bundle.extractall('.', filter='data')
          PY
          chmod 0755 install.sh tests/test-bootstrap.sh tests/test-main-channel.sh
          rm -f .automation/public-text-payload.tar.gz
          rmdir .automation 2>/dev/null || true
          rm -f .github/workflows/apply-rc1-publication.yml
      - name: Validate staged public release metadata
        run: |
          set -euo pipefail
          sh -n install.sh
          sh tests/test-bootstrap.sh
          sh tests/test-main-channel.sh
          python3 -m json.tool channels/preview.json >/dev/null
          python3 -m json.tool channels/stable.json >/dev/null
          python3 -m json.tool schemas/release-manifest.schema.json >/dev/null
          shellcheck install.sh tests/test-bootstrap.sh tests/test-main-channel.sh
      - name: Commit atomic public release staging
        run: |
          set -euo pipefail
          git config user.name 'Vivolution Technologies LLC'
          git config user.email '144343029+vivolution@users.noreply.github.com'
          git add -A
          git commit -m 'Release: stage v0.1.0-rc1 Controller bootstrap and metadata'
          git push origin HEAD:release/v0.1.0-rc1
